<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Murottal Al-Qur'an Player</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Hidden Audio / Video Element -->
  <audio id="audio-element" preload="metadata">
    <source src="https://cdn.islamic.network/quran/audio/128/ar.alafasy/1.mp3" type="audio/mp3">
    Browser Anda tidak mendukung elemen audio.
  </audio>

  <!-- App Wrapper -->
  <div class="player-app">

    <!-- Ambient Glow Background Canvas Elements -->
    <div class="bg-glow bg-glow-top"></div>
    <div class="bg-glow bg-glow-bottom"></div>

    <!-- Main Player Card Screen -->
    <div class="player-container">

      <!-- Top Header Navigation Bar -->
      <header class="player-header">
        <button class="header-btn" id="collapse-btn" aria-label="Kecilkan Player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div class="header-title-wrapper">
          <span class="header-subtitle">MEMUTAR SURAH</span>
          <h1 class="header-title" id="header-surah-title">Al-Fatihah</h1>
        </div>

        <button class="reciter-pill-btn" id="reciter-pill-btn" aria-label="Pilih Qori">
          <span class="reciter-name" id="pill-reciter-name">Mishary Rashid...</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </header>

      <!-- Center Medallion Visual Section -->
      <main class="player-main-content">
        <div class="medallion-container">
          <div class="medallion-glow"></div>
          <div class="medallion-ring-outer">
            <div class="medallion-ring-inner">
              <div class="islamic-star-pattern">
                <svg viewBox="0 0 200 200" fill="none" class="medallion-svg">
                  <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#38ef7d"/>
                      <stop offset="100%" stop-color="#11998e"/>
                    </linearGradient>
                    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stop-color="#134e4a"/>
                      <stop offset="100%" stop-color="#062c24"/>
                    </linearGradient>
                  </defs>

                  <!-- Outer Calligraphic Border Ring -->
                  <circle cx="100" cy="100" r="92" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
                  <circle cx="100" cy="100" r="86" stroke="url(#goldGrad)" stroke-width="1"/>
                  <circle cx="100" cy="100" r="80" fill="url(#innerGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>

                  <!-- 8-Pointed Rub el Hizb Geometric Star -->
                  <g stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.85">
                    <rect x="45" y="45" width="110" height="110" rx="4" transform="rotate(0 100 100)"/>
                    <rect x="45" y="45" width="110" height="110" rx="4" transform="rotate(45 100 100)"/>
                  </g>

                  <!-- Inner Decorative Mandala Ring -->
                  <circle cx="100" cy="100" r="52" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 2"/>
                  <circle cx="100" cy="100" r="42" fill="#0d3b32" stroke="url(#goldGrad)" stroke-width="1.2"/>

                  <!-- Center Calligraphy Text / Icon Symbol -->
                  <text x="100" y="108" font-family="'Amiri', serif" font-size="28" font-weight="bold" fill="#38ef7d" text-anchor="middle">القرآن</text>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Surah Info Meta Section -->
        <div class="track-info">
          <div class="surah-title-row">
            <h2 class="surah-name" id="track-surah-name">Al-Fatihah</h2>
            <span class="arabic-name" id="track-arabic-name">الفاتحة</span>
          </div>
          <p class="surah-details" id="track-details">Pembukaan • 7 Ayat • Mishary Rashid Alafasy</p>
        </div>
      </main>

      <!-- Player Controls & Timeline Footer Section -->
      <footer class="player-controls-section">

        <!-- Seek Timeline Bar -->
        <div class="timeline-wrapper">
          <div class="timeline-container" id="timeline-container">
            <div class="timeline-track">
              <div class="buffered-bar" id="buffered-bar"></div>
              <div class="progress-bar" id="progress-bar">
                <div class="progress-thumb"></div>
              </div>
            </div>
          </div>
          <div class="time-labels">
            <span id="current-time">00:00</span>
            <span id="duration-time">00:42</span>
          </div>
        </div>

        <!-- Primary Action Buttons Row -->
        <div class="control-actions">

          <!-- Repeat Toggle -->
          <button class="action-btn secondary-btn" id="repeat-btn" title="Mode Ulangi" aria-label="Mode Ulangi">
            <svg class="icon repeat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
            <span class="badge-one hidden" id="repeat-one-badge">1</span>
          </button>

          <!-- Skip -10 Seconds -->
          <button class="action-btn secondary-btn" id="skip-back-btn" title="Mundur 10 Detik" aria-label="Mundur 10 Detik">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 19l-9-7 9-7v14z"></path>
              <path d="M22 19l-9-7 9-7v14z"></path>
            </svg>
            <span class="skip-label">10</span>
          </button>

          <!-- Previous Surah -->
          <button class="action-btn secondary-btn" id="prev-btn" title="Surah Sebelumnya" aria-label="Surah Sebelumnya">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5"></line>
            </svg>
          </button>

          <!-- Play / Pause Main Glowing Button -->
          <button class="action-btn main-play-btn" id="main-play-btn" title="Putar / Jeda" aria-label="Putar/Jeda">
            <svg class="icon play-icon" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg class="icon pause-icon hidden" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" rx="1"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1"></rect>
            </svg>
          </button>

          <!-- Next Surah -->
          <button class="action-btn secondary-btn" id="next-btn" title="Surah Selanjutnya" aria-label="Surah Selanjutnya">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>

          <!-- Skip +10 Seconds -->
          <button class="action-btn secondary-btn" id="skip-forward-btn" title="Maju 10 Detik" aria-label="Maju 10 Detik">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 19l9-7-9-7v14z"></path>
              <path d="M2 19l9-7-9-7v14z"></path>
            </svg>
            <span class="skip-label">10</span>
          </button>

          <!-- Speed Pill Selector Button -->
          <button class="action-btn speed-pill-btn" id="speed-trigger-btn" title="Kecepatan Putar" aria-label="Kecepatan Putar">
            <span id="current-speed-label">1.0x</span>
          </button>

          <!-- Playlist Sheet Trigger Button -->
          <button class="action-btn secondary-btn" id="playlist-sheet-btn" title="Daftar Surah" aria-label="Daftar Surah">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </button>

        </div>
      </footer>

    </div>

    <!-- ==========================================
         BOTTOM SHEET DRAWERS (MODALS)
         ========================================== -->

    <!-- Drawer Overlay Backcloth -->
    <div class="sheet-overlay" id="sheet-overlay"></div>

    <!-- 1. Surah List Bottom Sheet Drawer -->
    <div class="bottom-sheet" id="surah-sheet" role="dialog" aria-label="Daftar Surah">
      <div class="sheet-header">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row">
          <h3 class="sheet-title">Daftar Surah</h3>
          <button class="sheet-close-btn" class="close-sheet-btn" data-close="surah-sheet" aria-label="Tutup">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <!-- Search Input -->
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="surah-search-input" placeholder="Cari Surah..." autocomplete="off">
        </div>
      </div>
      <div class="sheet-body">
        <div class="surah-list" id="surah-list-container">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </div>

    <!-- 2. Reciter / Qori Selector Bottom Sheet Drawer -->
    <div class="bottom-sheet" id="reciter-sheet" role="dialog" aria-label="Pilih Qori">
      <div class="sheet-header">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row">
          <h3 class="sheet-title">Pilih Qori</h3>
          <button class="sheet-close-btn" data-close="reciter-sheet" aria-label="Tutup">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <!-- Search Reciter -->
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="reciter-search-input" placeholder="Cari Qori..." autocomplete="off">
        </div>
      </div>
      <div class="sheet-body">
        <div class="reciter-list" id="reciter-list-container">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </div>

    <!-- 3. Playback Speed Selector Bottom Sheet Drawer -->
    <div class="bottom-sheet" id="speed-sheet" role="dialog" aria-label="Kecepatan Putar">
      <div class="sheet-header">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row">
          <h3 class="sheet-title">Kecepatan Putar</h3>
          <button class="sheet-close-btn" data-close="speed-sheet" aria-label="Tutup">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="sheet-body">
        <div class="speed-options-list">
          <button class="speed-item" data-speed="0.5">0.5x</button>
          <button class="speed-item" data-speed="0.75">0.75x</button>
          <button class="speed-item active" data-speed="1.0">Normal (1.0x)</button>
          <button class="speed-item" data-speed="1.25">1.25x</button>
          <button class="speed-item" data-speed="1.5">1.5x</button>
          <button class="speed-item" data-speed="2.0">2.0x</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
