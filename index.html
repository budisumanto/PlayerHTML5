<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JW Player HTML5 Video Player</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <!-- JWPlayer 8 Library -->
  <script src="https://content.jwplatform.com/libraries/KB5zFt7A.js"></script>
</head>
<body>
  <div class="page-container">
    <header class="header">
      <h1 class="title">JW Player</h1>
      <p class="subtitle">Custom Responsive HTML5 Video Player</p>
    </header>

    <main class="player-wrapper">
      <div id="video-container"></div>
    </main>

    <footer class="footer">
      <div class="keyboard-hints">
        <span class="hint-badge"><kbd>Spasi</kbd> / <kbd>K</kbd> Play/Pause</span>
        <span class="hint-badge"><kbd>J</kbd> / <kbd>L</kbd> ±10s</span>
        <span class="hint-badge"><kbd>←</kbd> <kbd>→</kbd> ±5s</span>
        <span class="hint-badge"><kbd>F</kbd> Fullscreen</span>
        <span class="hint-badge"><kbd>M</kbd> Mute</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
