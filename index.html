<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Player - Minimal Flat Video Player</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-container">
    <header class="header">
      <h1 class="title">Aura Player</h1>
      <p class="subtitle">Custom HTML5 Video Player • Minimal Flat Design</p>
    </header>

    <main class="player-wrapper">
      <div class="video-container" id="video-container" tabindex="0">
        <video id="video-element" preload="metadata" playsinline>
          <source src="sample.mp4" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>

        <!-- Top-Center Action Feedback Toast -->
        <div class="action-feedback-overlay" id="action-feedback" aria-live="polite"></div>

        <!-- Touch Seek Ripples / Hints -->
        <div class="seek-ripple seek-ripple-left" id="seek-ripple-left">
          <div class="ripple-content">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
            <span>-10s</span>
          </div>
        </div>
        <div class="seek-ripple seek-ripple-right" id="seek-ripple-right">
          <div class="ripple-content">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
            <span>+10s</span>
          </div>
        </div>

        <!-- Center Overlay (Play/Pause, Replay, Spinner, Error) -->
        <div class="center-overlay" id="center-overlay">
          <!-- Central Play / Pause / Replay Button -->
          <button class="central-play-btn" id="central-play-btn" aria-label="Toggle Play">
            <!-- Play Icon -->
            <svg class="icon play-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <!-- Pause Icon -->
            <svg class="icon pause-icon hidden" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
            <!-- Replay Icon -->
            <svg class="icon replay-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 4v6h6"></path>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
          </button>

          <!-- Loading Spinner -->
          <div class="loading-spinner hidden" id="loading-spinner">
            <div class="spinner-ring"></div>
          </div>

          <!-- Video Error State -->
          <div class="error-state hidden" id="error-state">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Playback Error</span>
          </div>
        </div>

        <!-- Settings Menu -->
        <div class="speed-menu settings-menu hidden" id="speed-menu" role="menu" aria-label="Settings">
          <div class="settings-header">
            <div class="settings-tabs" role="tablist">
              <button class="settings-tab" data-tab="quality" role="tab" aria-label="Quality">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="2" y="16" width="3" height="5" rx="0.5"/>
                  <rect x="7" y="12" width="3" height="9" rx="0.5"/>
                  <rect x="12" y="8" width="3" height="13" rx="0.5"/>
                  <rect x="17" y="4" width="3" height="17" rx="0.5"/>
                </svg>
              </button>
              <button class="settings-tab active" data-tab="speed" role="tab" aria-label="Speed">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"/>
                  <polyline points="12 6 12 12 16 14"/>
                </svg>
              </button>
              <button class="settings-tab" data-tab="captions" role="tab" aria-label="Captions">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="M7 15h3a2 2 0 0 0 0-4H7v4zm0-4V9h4"/>
                  <path d="M14 15h3a2 2 0 0 0 0-4h-3v4zm0-4V9h4"/>
                </svg>
              </button>
            </div>
            <button class="settings-close-btn" id="settings-close-btn" aria-label="Close Settings">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
          <div class="settings-list">
            <div class="settings-panel" data-panel="quality">
              <button class="quality-option active">Auto</button>
            </div>
            <div class="settings-panel active" data-panel="speed">
              <button class="speed-option" data-speed="0.5" role="menuitemradio" aria-checked="false">0.5x</button>
              <button class="speed-option" data-speed="0.75" role="menuitemradio" aria-checked="false">0.75x</button>
              <button class="speed-option active" data-speed="1.0" role="menuitemradio" aria-checked="true">1x</button>
              <button class="speed-option" data-speed="1.25" role="menuitemradio" aria-checked="false">1.25x</button>
              <button class="speed-option" data-speed="1.5" role="menuitemradio" aria-checked="false">1.5x</button>
              <button class="speed-option" data-speed="2.0" role="menuitemradio" aria-checked="false">2x</button>
            </div>
            <div class="settings-panel" data-panel="captions">
              <button class="caption-option active" data-track="off">Off</button>
            </div>
          </div>
        </div>

        <!-- Flush Bottom Controls Bar -->
        <div class="controls-bar" id="controls-bar">
          <!-- Timeline / Progress Bar -->
          <div class="timeline-container" id="timeline-container" role="slider" tabindex="0" aria-label="Seek timeline" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="00:00">
            <div class="timeline-track" id="timeline-track">
              <div class="buffered-bar" id="buffered-bar"></div>
              <div class="progress-bar" id="progress-bar">
                <div class="progress-thumb"></div>
              </div>
            </div>
            <div class="timeline-tooltip" id="timeline-tooltip">00:00</div>
          </div>

          <!-- Bottom Control Buttons Row -->
          <div class="controls-row">
            <!-- Left Controls Group -->
            <div class="controls-group left">
              <!-- Play / Pause Button -->
              <button class="control-btn" id="play-pause-btn" title="Play / Pause (Space / K)" aria-label="Play/Pause">
                <svg class="icon play-icon" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8 5v14l11-7z"/>
                </svg>
                <svg class="icon pause-icon hidden" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <svg class="icon replay-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 4v6h6"></path>
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
              </button>

              <!-- Rewind 10s Button -->
              <button class="control-btn" id="rewind-btn" title="Rewind 10s (J / Left)" aria-label="Rewind 10 seconds">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6 1 1 0 0 1 1-2.3"/>
                  <text x="12" y="14.5" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter, sans-serif">10</text>
                </svg>
              </button>

              <!-- Forward 10s Button -->
              <button class="control-btn" id="forward-btn" title="Forward 10s (L / Right)" aria-label="Forward 10 seconds">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 4V1l4 4-4 4V6a6 6 0 1 0 6 6 1 1 0 0 0-1-2.3"/>
                  <text x="12" y="14.5" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter, sans-serif">10</text>
                </svg>
              </button>

              <!-- Volume Control Container -->
              <div class="volume-container" id="volume-container">
                <button class="control-btn" id="mute-btn" title="Mute / Unmute (M)" aria-label="Mute" aria-pressed="false">
                  <svg class="icon volume-high-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  </svg>
                  <svg class="icon volume-muted-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                  </svg>
                </button>
                <div class="volume-slider-wrapper">
                  <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="1" aria-label="Volume">
                </div>
              </div>

              <!-- Time Display -->
              <div class="time-display">
                <span id="current-time">00:00</span>
                <span class="time-separator">/</span>
                <span id="duration-time">00:00</span>
              </div>
            </div>

            <!-- Right Controls Group -->
            <div class="controls-group right">
              <!-- Playback Speed / Settings Button -->
              <button class="control-btn speed-btn" id="speed-btn" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
              </button>

              <!-- Picture in Picture Button -->
              <button class="control-btn" id="pip-btn" title="Picture in Picture (P)" aria-label="Picture in Picture" aria-pressed="false">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                  <rect x="11" y="9" width="9" height="7" rx="1" ry="1"></rect>
                </svg>
              </button>

              <!-- Fullscreen Button -->
              <button class="control-btn" id="fullscreen-btn" title="Fullscreen (F)" aria-label="Fullscreen" aria-pressed="false">
                <svg class="icon fullscreen-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
                <svg class="icon fullscreen-exit hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="keyboard-hints">
        <span class="hint-badge"><kbd>Space</kbd> / <kbd>K</kbd> Play/Pause</span>
        <span class="hint-badge"><kbd>J</kbd> / <kbd>L</kbd> ±10s</span>
        <span class="hint-badge"><kbd>←</kbd> <kbd>→</kbd> ±5s</span>
        <span class="hint-badge"><kbd>↑</kbd> <kbd>↓</kbd> Volume</span>
        <span class="hint-badge"><kbd>F</kbd> Fullscreen</span>
        <span class="hint-badge"><kbd>M</kbd> Mute</span>
        <span class="hint-badge"><kbd>P</kbd> PiP</span>
        <span class="hint-badge"><kbd>0-9</kbd> Seek %</span>
        <span class="hint-badge"><kbd>&lt;</kbd> <kbd>&gt;</kbd> Speed</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
